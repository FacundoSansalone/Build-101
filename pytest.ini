[pytest]
# Tests de contracts/, guard/, intencion/, proxy/ y dashboard/ (los de world/
# se corren aparte, ver world/README.md). Desde la raíz del repo:
#   PYTHONUTF8=1 world/ap2/.venv/Scripts/python -m pytest
testpaths = contracts decisiones filtro guard intencion proxy dashboard taxonomia fabricante
python_files = test_*.py
pythonpath = .
addopts = -q --import-mode=importlib
